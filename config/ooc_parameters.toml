# OrganOnChip Problem Configuration
# Physical parameters from MATLAB TestProblem.m

[problem]
name = "OoC_Grid_Problem"
neq = 4
problem_type = "ooc"  # Config validation type (NOT the same as StaticCondensation problem_type)

[time_parameters]
T = 12000.0   # Final time
dt = 60.0  # Time step

[physical_parameters.viscosity]
nu = 200.0      # D_M: diffusivity of immune cells
mu = 700.0      # D_phi: diffusivity of chemoattractant phi
epsilon = 700.0 # D_omega: diffusivity of chemoactractant omega
sigma = 0.56     # D_T: diffusivity of tumor cells (56.0)

[physical_parameters.reaction]
a = 5.0e-4       # beta_phi: consumption rate of phi
c = 5.0e-4       # beta_omega: consumption rate of omega

[physical_parameters.coupling]
b = 1.0e-6      # alpha_phi: production rate of phi
d = 1.0e-6      # alpha_omega: production rate of omega

# Chemotaxis: chi(x) = k1 / (k2 + x)^2
[physical_parameters.chemotaxis]
type = "receptor_saturation"  # Type of chemotaxis function
k1 = 3.9e-1     # cellular drift velocity
k2 = 5.0e-6     # receptor dissociation constant

# Tumor suppression: lambda(x) = m1 / (m2 + x) -m3
[physical_parameters.tumor_suppression]
m1 = 1.9e-11 # k_omega1: killing efficiency of omega on tumor cells
m2 = 1.0e-4  # k_omega2: dissociation constant
m3 = 0.0

[discretization]
n_elements = 20
tau = [1.0, 0.5, 0.5, 0.5]
gam = 1.0   # Upwinding parameter for static condensation (0.0 = no upwind)

[initial_conditions]
u = "zeros"      # Default: zero initial condition
omega = "zeros"  # Default: zero initial condition  
v = "zeros"      # Default: zero initial condition
phi = "zeros"    # Default: zero initial condition

[force_functions]
u = "zeros"      # Default: zero force
omega = "zeros"  # Default: zero force
v = "zeros"      # Default: zero force
phi = "zeros"    # Default: zero force

# Domain-specific overrides for initial conditions
# Format: "domain_<id>_<equation_name>" = "function_name"
[domain_initial_conditions]
domain_0_v = "0002_constant"     # Domain 0, equation v -> grid  
domain_16_u = "2_constant"        # Domain 3, equation u -> grid

# Domain-specific overrides for force functions
# Format: "domain_<id>_<equation_name>" = "function_name"  
[domain_force_functions]
# No domain-specific forces by default
# domain_1_omega = "sin_2pi"  # Example: Domain 1, equation omega -> sin_2pi function

# Boundary condition overrides (per B-point, per equation)
# Keys: "<point_name>_<equation_name>"
# Values: { type = "dirichlet|neumann|robin", data = "function_name", ... }
# Default (when omitted): homogeneous Neumann on every boundary for every equation
#
[boundary_conditions]
# Override default homogeneous Neumann BCs at exterior boundary points.
# Format: "<point_name>_<equation_name>" = { type = "...", data = "..." }
#
# Boundary point names for build_grid_geometry with N=4 (default):
#   B0 = S1 (left vertical)  start   B1 = S1 end
#   B2 = S2 (lower middle)   start   B3 = S2 end
#   B4 = S3 (upper middle)   start   B5 = S3 end
#   B6 = S4 (right vertical) start   B7 = S4 end
#
# Equation names: u, omega, v, phi
# Supported types: dirichlet, neumann, robin
# Data: named function (e.g. "zeros", "constant") or sympy expression (e.g. "150.0+0.0*t")
#
# Examples (uncomment to activate):
# B0_u   = { type = "dirichlet", data = "zeros" }
# B2_phi = { type = "neumann",   data = "150.0+0.0*t" }
# B4_u   = { type = "robin", alpha = 1.0, beta = -1.0, data = "zeros" }
# B1_v   = { type = "neumann", data = "500.0+0.0*t" }

