dt = 10.0

[discretization]
n_elements = 50
tau = [ 0.5, 0.5, 0.5, 0.5,]

[initial_conditions]
u = "zeros"
omega = "zeros"
v = "zeros"
phi = "zeros"

[force_functions]
u = "zeros"
omega = "zeros"
v = "zeros"
phi = "zeros"

[domain_initial_conditions]
domain_4_v = "gaussian"
domain_11_u = "gaussian"

[domain_force_functions]

[physical_parameters.viscosity]
nu = 10.0
mu = 200.0
epsilon = 1e-12
sigma = 1e-12

[physical_parameters.reaction]
a = 0.1
c = 0.1
b = 0.01
d = 1e-16

[physical_parameters.coupling]
b = 0.0001
d = 0.0001
a = 1e-12
c = 1e-16

[physical_parameters.chemotaxis]
type = "receptor_saturation"
