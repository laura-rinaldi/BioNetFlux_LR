[problem]
name = "OoC_Grid_Problem"
neq = 4
problem_type = "ooc"

[time_parameters]
T = 200.0
dt = 10.0

[discretization]
n_elements = 50
tau = [ 0.5, 0.5, 0.5, 0.5,]

[initial_conditions]
u = "zeros"
omega = "zeros"
v = "zeros"
phi = "zeros"

[force_functions]
u = "zeros"
omega = "zeros"
v = "zeros"
phi = "zeros"

[domain_initial_conditions]
domain_4_v = "gaussian"
domain_11_u = "gaussian"
domain_1_phi = "constant"

[domain_force_functions]

[physical_parameters.viscosity]
nu = 1e-12
mu = 1e-12
epsilon = 1e-12
sigma = 56.0

[physical_parameters.coupling]
a = 1e-16
c = 1e-16

[physical_parameters.reaction]
b = 1e-16
d = 1e-16

[physical_parameters.chemotaxis]
type = "receptor_saturation"
k1 = 3.9
k2 = 500.0

[physical_parameters.tumor_suppression]
m1 = 1e-16
m2 = 0.0001
